name: 🚀 编译 Build_RedmiAX3000_ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "openWRT 仓库的拥有者"
        type: string
        required: true
        default: "zhouun"
      repo:
        description: "openWRT 仓库的名字"
        type: string
        required: true
        default: "Redmi_AX3000_immortalwrt"
      branch:
        description: "openWRT 仓库的分支"
        type: string
        required: true
        default: "redmi_ax3000-24.10"
      ssh:
        description: "SSH 调试 (tmate) - 首次建议开启，配置完后继续编译"
        type: boolean
        default: false
      isFiles:
        description: "启用 files 目录注入 (需仓库根目录有 files 文件夹)"
        type: boolean
        default: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    permissions:
      contents: write

    steps:
      # 1️⃣ 检出代码
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # 2️⃣ 清理磁盘空间 (极大降低 No space left on device 概率)
      - name: 初始化编译环境 (Free Disk Space)
        uses: jlumbroso/free-disk-space-action@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 3️⃣ 安装依赖
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y $(curl -fsSL https://is.gd/depends_ubuntu_2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      # 4️⃣ 克隆源码
      - name: 克隆 OpenWrt 源码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          path: openWRT
          fetch-depth: 1

      # 5️⃣ 关键：加载自定义配置
      - name: 加载自定义配置
        run: |
          # 如果仓库根目录有 .config，直接覆盖
          [ -f .config ] && cp -f .config openWRT/
          [ -f diy.sh ] && cp -f diy.sh openWRT/
          # 如果开启了 files 注入
          [ -d files ] && [ "${{ inputs.isFiles }}" == "true" ] && cp -r files openWRT/
          
          # 执行自定义脚本
          cd openWRT
          [ -f diy.sh ] && chmod +x diy.sh && ./diy.sh

      # 6️⃣ 更新 Feeds
      - name: 更新并安装 Feeds
        working-directory: openWRT
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 7️⃣ 缓存优化 (加快后续编译)
      - name: 缓存 DL 源码库
        uses: actions/cache@v4
        with:
          path: openWRT/dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('openWRT/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      # 8️⃣ SSH 调试 (tmate)
      # 如果开启，会输出 SSH 连接信息。连接后输入 make menuconfig 修改配置。
      # 修改完后，输入 exit 或者在 Actions 页面 Cancel Debugging 即可继续后续步骤 (注意不要 cancel workflow)
      - name: SSH 调试 (tmate)
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.ssh }}

      # 9️⃣ ⭐️ 关键步骤：备份配置 (无论 SSH 是否修改，都在此处保存一份)
      # 这样即使后面编译失败，你也能拿到最新的配置
      - name: 生成并备份配置
        working-directory: openWRT
        run: |
          make defconfig
          cp .config ${{ github.workspace }}/openwrt.config
          
      - name: 上传配置到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt_config_backup
          path: ${{ github.workspace }}/openwrt.config

      # 🔟 预下载 DL 库 (防止编译时网络中断)
      - name: 下载软件包
        working-directory: openWRT
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \;

      # 1️⃣1️⃣ 编译固件 (多线程 -> 失败转单线程)
      - name: 编译固件
        id: compile
        working-directory: openWRT
        run: |
          echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
          echo "=== 开始编译 ==="
          make -j$(nproc) || make -j1 V=s
          echo "=== 编译完成 ==="

      # 1️⃣2️⃣ 整理输出文件
      - name: 整理输出文件
        id: organize
        if: success() && !cancelled()
        run: |
          mkdir -p firmware_files
          cd openWRT/bin/targets/*/*
          rm -rf packages
          
          # 复制固件
          cp -rf * ${{ github.workspace }}/firmware_files/
          # 复制配置文件 (重命名以便识别)
          cp ${{ github.workspace }}/openwrt.config ${{ github.workspace }}/firmware_files/full.config
          
          echo "FIRMWARE=${{ github.workspace }}/firmware_files" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # 1️⃣3️⃣ 发布 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          tag_name: v${{ env.FILE_DATE }}
          name: OpenWrt Build ${{ env.FILE_DATE }}
          files: ${{ env.FIRMWARE }}/*
          body: |
            ### 编译信息
            - 源码: `${{ inputs.owner }}/${{ inputs.repo }}`
            - 分支: `${{ inputs.branch }}`
            - 时间: ${{ env.FILE_DATE }}
            
            ### ⚙️ 配置文件使用方法
            如果你想复用这次的配置：
            1. 下载附件中的 `full.config`。
            2. 重命名为 `.config`。
            3. 上传到你的 GitHub 仓库根目录。
            4. 下次运行 Actions 时，**取消勾选 SSH** 即可自动使用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
