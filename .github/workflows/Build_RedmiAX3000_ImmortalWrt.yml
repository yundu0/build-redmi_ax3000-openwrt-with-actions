name: 🚀 编译 Build_RedmiAX3000_ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "openWRT 仓库的拥有者"
        type: string
        required: true
        default: "zhouun"
      repo:
        description: "openWRT 仓库的名字"
        type: string
        required: true
        default: "Redmi_AX3000_immortalwrt"
      branch:
        description: "openWRT 仓库的分支"
        type: string
        required: true
        default: "redmi_ax3000-24.10"
      ssh:
        description: "SSH 连接调试"
        type: boolean
        default: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    permissions:
      contents: write
    
    steps:
      - name: ⬇️ 检出代码
        uses: actions/checkout@v4

      - name: 🧹 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 📦 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gnutls-dev gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
          libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: ⬇️ 克隆 OpenWrt 源码
        uses: actions/checkout@v4
        with:
          repository: "${{ inputs.owner }}/${{ inputs.repo }}"
          ref: ${{ inputs.branch }}
          path: openWRT

      - name: 📂 加载自定义配置
        run: |
          if [ -d "files" ]; then
            echo "✅ 检测到 files 目录，正在复制..."
            cp -r files openWRT/files
          fi
          if [ -f "diy.sh" ]; then
            echo "✅ 检测到 diy.sh，正在执行..."
            chmod +x diy.sh
            cp diy.sh openWRT/
            cd openWRT
            ./diy.sh
            cd ..
          fi
          if [ -f ".config" ]; then
            echo "✅ 检测到 .config，正在复制..."
            cp .config openWRT/.config
          else
            echo "❌ 警告：仓库中没有 .config 文件！将使用默认配置。"
          fi

      - name: 🔄 更新 Feeds & 生成配置
        working-directory: openWRT
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: ⬇️ 下载软件包
        working-directory: openWRT
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 📡 SSH 连接调试
        uses: csexton/debugger-action@master
        if: ${{ inputs.ssh }}

      - name: 🚀 开始编译
        working-directory: openWRT
        run: |
          echo "=== 编译开始 ==="
          make -j$(nproc) || make -j1 V=s
          echo "=== 编译结束 ==="

      - name: 📦 整理编译产物
        id: organize
        if: success()
        run: |
          mkdir -p firmware
          find openWRT/bin/targets -name "*.bin" -exec cp {} firmware/ \;
          find openWRT/bin/targets -name "*.img.gz" -exec cp {} firmware/ \;
          cp openWRT/.config firmware/build.config
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📤 上传固件
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_Firmware
          path: firmware/

      - name: 🎉 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        with:
          tag_name: Release-${{ env.BUILD_DATE }}
          files: firmware/*
          body: |
            **编译状态**: ✅ 成功
            **源码仓库**: `${{ inputs.owner }}/${{ inputs.repo }}`
            **分支**: `${{ inputs.branch }}`
            **时间**: ${{ env.BUILD_DATE }}
        env:
          BUILD_DATE: $(date +'%Y.%m.%d-%H%M')
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
