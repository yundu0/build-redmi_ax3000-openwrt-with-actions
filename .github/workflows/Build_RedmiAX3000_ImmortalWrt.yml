name: 🚀 编译 Build_RedmiAX3000_ImmortalWrt
on:
  workflow_dispatch:
    inputs:
      owner:
        description: "openWRT 仓库的拥有者 (Owner of openWRT repo)"
        type: string
        required: true
        default: "zhouun"
      repo:
        description: "openWRT 仓库的名字 (Name of openWRT repo)"
        type: string
        required: true
        default: "Redmi_AX3000_immortalwrt"
      branch:
        description: "openWRT 仓库的分支 (Branch of openWRT repo)"
        type: string
        required: true
        default: "redmi_ax3000-24.10"
      multithreading:
        description: "开启多线程编译 (Enable multithreading build)"
        type: boolean
        default: true
      ssh:
        description: "使用 ssh 连接到编译环境 (Connect to the build environment using ssh)"
        type: boolean
        default: false
      isFiles:
        description: "使用files大法 (Whether to upload the etc files)"
        type: boolean
        default: false
      useOldConfig:
        description: "使用 oldconfig 更新配置 (Use oldconfig to update config)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    permissions:
      contents: write
      
    steps:
      - name: 显示磁盘空间使用情况
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: 释放磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 3072
          swap-size-mb: 1
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: 磁盘空间清理完成
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 克隆当前仓库
        uses: actions/checkout@v4

      - name: 验证本地配置文件
        run: |
          echo "=== 当前仓库文件列表 ==="
          ls -la
          echo ""
          
          echo "=== 检查关键文件是否存在 ==="
          if [ -f .config ]; then
            echo "✅ .config 文件存在"
            echo "文件大小：$(wc -c < .config) 字节"
            echo "配置项数量：$(grep -c '^CONFIG_' .config)"
            echo "前10行内容："
            head -10 .config
          else
            echo "❌ 错误：.config 文件不存在！"
            echo "当前目录文件："
            ls -la
            exit 1
          fi

      - name: 克隆 openWRT 仓库
        uses: actions/checkout@v4
        with:
          repository: "${{inputs.owner}}/${{inputs.repo}}"
          ref: ${{inputs.branch}}
          path: openWRT

      - name: 复制配置文件到 openWRT 仓库
        run: |
          echo "=== 复制配置文件 ==="
          cd openWRT
          
          # 从上级目录复制配置文件
          if [ -f ../.config ]; then
            cp -f ../.config ./
            chmod 644 .config
            echo "✅ 已复制 .config 文件"
          else
            echo "❌ 错误：源 .config 文件不存在"
            exit 1
          fi
          
          if [ -f ../diy.sh ]; then
            cp -f ../diy.sh ./
            chmod +x diy.sh
            echo "✅ 已复制 diy.sh 文件"
          fi

      - name: 验证复制后的配置文件
        working-directory: openWRT
        run: |
          echo "=== 验证复制结果 ==="
          if [ -f .config ]; then
            echo ".config 文件存在"
            echo "文件大小：$(wc -c < .config) 字节"
            echo "配置项数量：$(grep -c '^CONFIG_' .config)"
            echo "前10行内容："
            head -10 .config
          else
            echo "❌ 错误：.config 文件复制失败"
            exit 1
          fi

      - name: 如果选择了上传 files 大法，则复制 files 目录
        if: ${{inputs.isFiles == true}}
        run: |
          echo "=== 复制 files 目录 ==="
          if [ -d files ]; then
            cp -r files openWRT/
            echo "✅ 已复制 files 目录"
          else
            echo "❌ 错误：当前目录下没有 files 目录"
            exit 1
          fi

      - name: 运行 diy.sh 脚本
        if: ${{ inputs.ssh == false }}
        working-directory: openWRT
        run: |
          echo "=== 运行 diy.sh 脚本 ==="
          if [ -f diy.sh ]; then
            ./diy.sh
            echo "✅ diy.sh 执行完成"
          else
            echo "⚠️  diy.sh 不存在，跳过执行"
          fi

      - name: 更新并下载 feeds
        working-directory: openWRT
        run: |
          echo "=== 更新 feeds ==="
          ./scripts/feeds update -a
          echo "=== 安装 feeds ==="
          ./scripts/feeds install -a

      - name: 处理配置文件
        working-directory: openWRT
        run: |
          echo "=== 处理配置文件 ==="
          echo "当前 .config 状态："
          echo "文件大小：$(wc -c < .config) 字节"
          echo "配置项数量：$(grep -c '^CONFIG_' .config)"
          
          # 根据输入参数决定如何处理配置文件
          if [ "${{ inputs.useOldConfig }}" == "true" ]; then
            echo "=== 使用 oldconfig 更新配置 ==="
            # 使用 oldconfig 更新配置以适应新源码，但仍保持你的配置
            yes "" | make oldconfig
            echo "✅ oldconfig 执行完成"
          else
            echo "=== 跳过配置文件重新生成，使用原始配置 ==="
            # 不执行任何配置生成命令，直接使用你提供的配置
          fi
          
          echo "=== 最终 .config 状态 ==="
          echo "文件大小：$(wc -c < .config) 字节"
          echo "配置项数量：$(grep -c '^CONFIG_' .config)"

      - name: 验证最终配置文件
        working-directory: openWRT
        run: |
          echo "=== 最终配置文件验证 ==="
          if [ -f .config ]; then
            echo "✅ .config 文件存在"
            echo "文件大小：$(wc -c < .config) 字节"
            echo "配置项数量：$(grep -c '^CONFIG_' .config)"
            
            # 检查一些关键配置项是否存在
            echo "检查关键配置项："
            grep "CONFIG_TARGET.*DEVICE" .config || echo "未找到设备配置"
            grep "CONFIG_PACKAGE_luci" .config || echo "未找到 LuCI 配置"
          else
            echo "❌ 错误：.config 文件丢失"
            exit 1
          fi

      - name: 使用ssh连接编译环境
        if: ${{inputs.ssh == true}}
        uses: csexton/debugger-action@master

      - name: SSH调试后上传 .config
        if: ${{inputs.ssh == true}}
        uses: actions/upload-artifact@v4
        with:
          name: config-after-ssh-debug
          path: openWRT/.config

      - name: 多线程编译 openWRT
        if: ${{inputs.multithreading == true && inputs.ssh == false}}
        working-directory: openWRT
        run: |
          echo "=== 开始多线程编译 ==="
          echo "使用线程数：$(nproc)"
          make -j$(nproc) V=s

      - name: 单线程编译 openWRT
        if: ${{inputs.multithreading == false && inputs.ssh == false}}
        working-directory: openWRT
        run: |
          echo "=== 开始单线程编译 ==="
          make -j1 V=s

      - name: 上传编译结果到 Artifact
        if: ${{ inputs.ssh == false }}
        uses: actions/upload-artifact@v4
        with:
          name: openWRT-build-result
          path: openWRT/bin/targets

      - name: 准备 Release 标签和标题
        if: ${{ inputs.ssh == false }}
        id: release_meta
        run: |
          echo "tag_name=Release-$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
          echo "release_name=ImmortalWrt Build $(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: 上传固件到 Release
        if: ${{ inputs.ssh == false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            **仓库:** `${{ inputs.owner }}/${{ inputs.repo }}`
            **分支:** `${{ inputs.branch }}`
            **多线程:** ${{ inputs.multithreading }}
            **Files大法:** ${{ inputs.isFiles }}
            **使用 OldConfig:** ${{ inputs.useOldConfig }}
            **编译时间:** $(date +'%Y-%m-%d %H:%M:%S')
          files: openWRT/bin/targets/**/*
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
