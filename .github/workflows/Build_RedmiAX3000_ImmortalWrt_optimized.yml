name: 🚀 编译 Build_RedmiAX3000_ImmortalWrt
on:
  workflow_dispatch:
    inputs:
      owner:
        description: "openWRT 仓库的拥有者 (Owner of openWRT repo)"
        type: string
        required: true
        default: "zhouun"
      repo:
        description: "openWRT 仓库的名字 (Name of openWRT repo)"
        type: string
        required: true
        default: "Redmi_AX3000_immortalwrt"
      branch:
        description: "openWRT 仓库的分支 (Branch of openWRT repo)"
        type: string
        required: true
        default: "redmi_ax3000-24.10"
      multithreading:
        description: "开启多线程编译 (Enable multithreading build)"
        type: boolean
        default: true
      ssh:
        description: "使用 ssh 连接到编译环境 (Connect to the build environment using ssh)"
        type: boolean
        default: false
      isFiles:
        description: "使用files大法 (Whether to upload the etc files)"
        type: boolean
        default: false

env:
  # 统一定义 ccache 路径，方便后续缓存步骤引用
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    permissions:
      contents: write
    steps:
      # -----------------------------------------------------------------
      # 1️⃣ 磁盘空间优化（精简为单一方案）
      # -----------------------------------------------------------------
      - name: Before freeing up disk space
        run: |
          echo "==== 清理前磁盘状态 ===="
          df -hT

      # 只保留 maximize-build-space，它已能满足需求，
      # 避免重复运行多个清理 Action 浪费时间（节省约 2-4 分钟）
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Free up disk space complete
        run: |
          echo "==== 清理后磁盘状态 ===="
          df -hT

      # -----------------------------------------------------------------
      # 2️⃣ 安装编译所需的系统依赖
      # -----------------------------------------------------------------
      - name: 下载编译所需的依赖 (Install required packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged \
            help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      # -----------------------------------------------------------------
      # 3️⃣ 拉取代码 & 复制 .config / diy.sh
      # -----------------------------------------------------------------
      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 验证本地配置文件
        run: |
          echo "=== 检查关键文件是否存在 ==="
          if [ -f .config ]; then
            echo "✅ .config 文件存在"
          else
            echo "❌ 错误：.config 文件不存在！"
            exit 1
          fi
          if [ -f diy.sh ]; then
            echo "✅ diy.sh 文件存在"
          else
            echo "⚠️  diy.sh 文件不存在"
          fi

      - name: 克隆 openWRT 仓库 (Clone openWRT repo)
        uses: actions/checkout@v4
        with:
          repository: "${{ inputs.owner }}/${{ inputs.repo }}"
          ref: ${{ inputs.branch }}
          path: openWRT

      - name: 复制配置文件到 openWRT 仓库
        run: |
          cp -f .config openWRT/
          if [ -f diy.sh ]; then
            cp -f diy.sh openWRT/
          fi
          echo "✅ 配置文件复制完成"

      # -----------------------------------------------------------------
      # 4️⃣ 可选的 files/ 复制（isFiles）
      # -----------------------------------------------------------------
      - name: 复制 files 目录到 openWRT 仓库（如已启用）
        if: ${{ inputs.isFiles }}
        run: |
          if [ -d files ]; then
            cp -r files openWRT/
            echo "✅ 已复制 files 目录"
          else
            echo "⚠️ files 目录不存在，跳过复制"
          fi

      # -----------------------------------------------------------------
      # 5️⃣ 运行 diy.sh
      # -----------------------------------------------------------------
      - name: 运行 diy.sh (Run diy.sh)
        working-directory: openWRT
        run: |
          if [ -f diy.sh ]; then
            chmod +x diy.sh
            ./diy.sh
            echo "✅ diy.sh 执行完成"
          else
            echo "⚠️ diy.sh 不存在，跳过执行"
          fi

      # -----------------------------------------------------------------
      # 6️⃣ 恢复 ccache 缓存（加速二次编译）
      # -----------------------------------------------------------------
      - name: 恢复 ccache 缓存 (Restore ccache cache)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # 以仓库+分支为基础 key，每次命中则尽量复用
          key: ccache-${{ inputs.repo }}-${{ inputs.branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.repo }}-${{ inputs.branch }}-
            ccache-${{ inputs.repo }}-

      # -----------------------------------------------------------------
      # 7️⃣ 恢复 feeds & dl 缓存（大幅减少下载时间）
      # -----------------------------------------------------------------
      - name: 恢复 feeds & dl 缓存 (Restore feeds & dl cache)
        uses: actions/cache@v4
        id: feeds-dl-cache
        with:
          path: |
            openWRT/dl
            openWRT/feeds
          # feeds.conf.default 变化时自动失效旧缓存
          key: feeds-dl-${{ inputs.repo }}-${{ inputs.branch }}-${{ hashFiles('openWRT/feeds.conf.default') }}
          restore-keys: |
            feeds-dl-${{ inputs.repo }}-${{ inputs.branch }}-
            feeds-dl-${{ inputs.repo }}-

      # -----------------------------------------------------------------
      # 8️⃣ 更新并下载 feeds（缓存命中时跳过大部分下载）
      # -----------------------------------------------------------------
      - name: 更新并下载 feeds (Update and install feeds)
        working-directory: openWRT
        run: |
          echo "=== 更新 feeds ==="
          ./scripts/feeds update -a
          echo "=== 安装 feeds ==="
          ./scripts/feeds install -a

      # -----------------------------------------------------------------
      # 9️⃣ 检查 feeds 安装结果和已选安装包
      # -----------------------------------------------------------------
      - name: 检查 feeds 安装结果和已选安装包
        working-directory: openWRT
        run: |
          echo "==============================="
          echo "检查关键软件包是否安装："
          echo "==============================="
          find package/feeds -name "luci-app-argon"      || echo "❌ argon 未安装"
          find package/feeds -name "luci-app-filemanager" || echo "❌ filemanager 未安装"
          find package/feeds -name "luci-app-socat"      || echo "❌ socat 未安装"
          find package/feeds -name "luci-theme-ttyd"     || echo "❌ ttyd 未安装"
          find package/feeds -name "luci-app-turboacc"   || echo "❌ turboacc 未安装"
          echo ""
          echo "==============================="
          echo "已选安装包列表："
          echo "==============================="
          grep -E '^CONFIG_PACKAGE_.+=(y|m)' .config | cut -d'=' -f1 | sed 's/CONFIG_PACKAGE_//' | sort
          echo ""
          echo "==============================="
          echo "已选 luci-app 包列表："
          echo "==============================="
          grep -E '^CONFIG_PACKAGE_luci-app.+=(y|m)' .config | cut -d'=' -f1 | sed 's/CONFIG_PACKAGE_//' | sort

      # -----------------------------------------------------------------
      # 🔟 查看编译前 .config
      # -----------------------------------------------------------------
      - name: 📑 查看编译前 .config（日志输出）
        working-directory: openWRT
        run: |
          echo "===== .config 文件大小 & 行数 ====="
          ls -lh .config
          wc -l .config
          echo "===== 关键软件包检查 ====="
          grep -E 'CONFIG_PACKAGE_(luci-app-argon|luci-app-filemanager|luci-app-socat|luci-theme-ttyd|luci-app-turboacc)=' .config \
            || echo "关键包配置未找到！"

      # -----------------------------------------------------------------
      # 1️⃣1️⃣ 上传编译使用的配置文件
      # -----------------------------------------------------------------
      - name: 上传编译使用的配置文件
        uses: actions/upload-artifact@v4
        with:
          name: config-used-for-build
          path: openWRT/.config
          include-hidden-files: true

      # -----------------------------------------------------------------
      # 1️⃣2️⃣ 可选的 SSH 调试
      # -----------------------------------------------------------------
      - name: 使用 SSH 连接编译环境（限时15分钟，输入 `touch /tmp/keepalive` 保活）
        if: ${{ inputs.ssh }}
        uses: csexton/debugger-action@master

      - name: SSH 调试后上传配置文件（调试期间可能手动改了 .config）
        if: ${{ inputs.ssh }}
        uses: actions/upload-artifact@v4
        with:
          name: config-after-ssh-debug
          path: |
            openWRT/.config
            openWRT/feeds.conf.default
          include-hidden-files: true

      # -----------------------------------------------------------------
      # 1️⃣3️⃣ 编译（多线程失败自动降级单线程 + ccache 加速）
      # -----------------------------------------------------------------
      - name: 多线程编译 openWRT（失败自动降级单线程输出详细日志）
        if: ${{ inputs.multithreading && !inputs.ssh }}
        working-directory: openWRT
        run: |
          echo "=== 开始多线程编译，线程数：$(nproc) ==="
          # 启用 ccache
          export USE_CCACHE=1
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          ccache --max-size=2G
          ccache -z  # 重置统计
          # 先多线程尝试，失败后自动降级单线程并输出完整日志
          make -j$(nproc) || {
            echo ""
            echo "❌ 多线程编译失败！正在以单线程重试并输出详细日志..."
            make -j1 V=s 2>&1 | tail -n 200
            exit 1
          }
          echo "=== ccache 命中率统计 ==="
          ccache -s

      - name: 单线程编译 openWRT（详细日志）
        if: ${{ !inputs.multithreading && !inputs.ssh }}
        working-directory: openWRT
        run: |
          echo "=== 开始单线程编译 ==="
          export USE_CCACHE=1
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          ccache --max-size=2G
          ccache -z
          make -j1 V=s
          echo "=== ccache 命中率统计 ==="
          ccache -s

      # -----------------------------------------------------------------
      # 1️⃣4️⃣ 上传编译产物（固件 + 最终 .config）
      # -----------------------------------------------------------------
      - name: 上传编译结果和最终配置到 Artifact
        if: ${{ !inputs.ssh }}
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-result
          path: |
            openWRT/bin/targets
            openWRT/.config
            openWRT/feeds.conf.default
          include-hidden-files: true

      # -----------------------------------------------------------------
      # 1️⃣5️⃣ 准备 Release 并发布
      # -----------------------------------------------------------------
      - name: 准备 Release 标签和标题
        id: release_meta
        if: ${{ !inputs.ssh }}
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d-%H-%M')
          echo "tag_name=Release-${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "release_name=ImmortalWrt Build ${BUILD_TIME}" >> $GITHUB_OUTPUT

          # 尝试获取 openWRT 仓库的最新提交 hash，方便追溯
          cd openWRT
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT

      - name: 上传固件到 Release
        if: ${{ !inputs.ssh }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            ## 📦 ImmortalWrt 固件构建信息

            | 项目 | 值 |
            |------|-----|
            | **仓库** | `${{ inputs.owner }}/${{ inputs.repo }}` |
            | **分支** | `${{ inputs.branch }}` |
            | **提交** | `${{ steps.release_meta.outputs.commit_hash }}` |
            | **多线程** | ${{ inputs.multithreading }} |
            | **Files 大法** | ${{ inputs.isFiles }} |
            | **SSH 调试** | ${{ inputs.ssh }} |
            | **编译时间** | ${{ steps.release_meta.outputs.tag_name }} |

            > 固件适用于 Redmi AX3000，基于 ImmortalWrt。
          files: |
            openWRT/bin/targets/**/*
            openWRT/.config
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
